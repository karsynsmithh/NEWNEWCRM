<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d9488" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CREPro" />
  <title>CRE Dashboard</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="logo">CRE<span class="logo-accent">Pro</span></span>
        <button class="hamburger" id="hamburger" aria-label="Toggle menu">&#9776;</button>
      </div>
      <nav class="sidebar-nav">
        <a href="#dashboard" class="nav-link" data-page="dashboard">
          <span class="nav-icon">&#127968;</span>
          <span class="nav-label">Dashboard</span>
        </a>
        <a href="#properties" class="nav-link" data-page="properties">
          <span class="nav-icon">&#127970;</span>
          <span class="nav-label">Properties</span>
        </a>
        <a href="#contacts" class="nav-link" data-page="contacts">
          <span class="nav-icon">&#128101;</span>
          <span class="nav-label">Contacts</span>
        </a>
        <a href="#deals" class="nav-link" data-page="deals">
          <span class="nav-icon">&#129309;</span>
          <span class="nav-label">Deals</span>
        </a>
        <a href="#followups" class="nav-link" data-page="followups">
          <span class="nav-icon">&#9989;</span>
          <span class="nav-label">Follow-ups</span>
        </a>
        <a href="#activities" class="nav-link" data-page="activities">
          <span class="nav-icon">&#128203;</span>
          <span class="nav-label">Activity Log</span>
        </a>
        <a href="#comps" class="nav-link" data-page="comps">
          <span class="nav-icon">&#128202;</span>
          <span class="nav-label">Comps</span>
        </a>
        <a href="#vendors" class="nav-link" data-page="vendors">
          <span class="nav-icon">&#128193;</span>
          <span class="nav-label">Vendors</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="/logout" class="nav-link nav-logout">
          <span class="nav-icon">&#x2192;</span>
          <span class="nav-label">Log Out</span>
        </a>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main-content">
      <div class="mobile-header">
        <button class="hamburger" id="hamburger-mobile">&#9776;</button>
        <span class="logo">CRE<span class="logo-accent">Pro</span></span>
      </div>

      <div id="page-dashboard" class="page"></div>
      <div id="page-properties" class="page"></div>
      <div id="page-contacts" class="page"></div>
      <div id="page-deals" class="page"></div>
      <div id="page-followups" class="page"></div>
      <div id="page-activities" class="page"></div>
      <div id="page-comps" class="page"></div>
      <div id="page-vendors" class="page"></div>
    </main>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <!-- Modal backdrop -->
  <div class="modal-backdrop" id="modal-backdrop"></div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modal-header">
      <h2 class="modal-title" id="modal-title">Modal</h2>
      <button class="modal-close" id="modal-close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="modal-save">Save</button>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/notes.js"></script>
  <script src="/js/attachments.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/properties.js"></script>
  <script src="/js/contacts.js"></script>
  <script src="/js/deals.js"></script>
  <script src="/js/followups.js"></script>
  <script src="/js/activities.js"></script>
  <script src="/js/comps.js"></script>
  <script src="/js/vendors.js"></script>
</body>
</html>
