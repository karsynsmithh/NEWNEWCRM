app = "crepro-dashboard"
primary_region = "dfw"

[build]

[env]
  PORT = "3000"
  NODE_ENV = "production"
  DB_PATH = "/data/cre_dashboard.db"
  UPLOADS_PATH = "/data/uploads"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/login"
    timeout = "5s"

[[mounts]]
  source = "crepro_data"
  destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
